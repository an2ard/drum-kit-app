
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BeatBox</title>

    <!-- Connects the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main drum kit container -->
    <main class="drum-kit">

        <!-- Main heading displaying the app name -->
        <h1>BeatBox</h1>

        <!-- Container for all drum buttons -->
        <div class="drum-buttons">

            <!-- Kick drum button -->
            <button id="kickButton" class="drum-button">
                KICK
                <span>A</span>
            </button>

            <!-- Ride cymbal button -->
            <button id="rideButton" class="drum-button ride-button">
                RIDE
                <span>S</span>
            </button>

            <!-- Snare drum button -->
            <button id="snareButton" class="drum-button snare-button">
                SNARE
                <span>D</span>
            </button>

            <!-- Tom drum button -->
            <button id="tomButton" class="drum-button tom-button">
                TOM
                <span>F</span>
            </button>

            <!-- Hi-hat cymbal button -->
            <button id="hihatButton" class="drum-button hihat-button">
                HI-HAT
                <span>G</span>
            </button>

        </div>

        <!-- Preloads all five drum sounds -->
        <audio id="kickSound" src="sounds/kick.mp3" preload="auto"></audio>

        <audio id="rideSound" src="sounds/ride.mp3" preload="auto"></audio>

        <audio id="snareSound" src="sounds/snare.mp3" preload="auto"></audio>

        <audio id="tomSound" src="sounds/tom.mp3" preload="auto"></audio>

        <audio id="hihatSound" src="sounds/hihat.mp3" preload="auto"></audio>

    </main>

    <!-- Connects the JavaScript file -->
    <script src="actions.js"></script>

</body>
</html>
